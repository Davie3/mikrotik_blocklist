name: update_blocklist

on:
  schedule:
    # Running every 3h
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update_blocklist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Worst case downloads: 4 curl attempts x 180 s, in parallel.
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Clone Project
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12" # keep in sync with mise.toml

      - name: Run Tests
        run: python3 -m unittest discover -s tests -v

      - name: Generate Blocklists
        id: generate
        run: sh scripts/ci_generate.sh

      - name: Validate Generated Lists
        run: python3 scripts/validate_lists.py

      - name: Commit Generated Files
        run: sh scripts/commit_lists.sh

      - name: Push Changes
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # v1.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main

      - name: Fail on Stale Feeds
        if: steps.generate.outputs.rc == '2'
        run: echo "::error::Stale feeds were left out of the published lists; see the Generate Blocklists step" && exit 1
